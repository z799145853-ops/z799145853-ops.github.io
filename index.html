$('markmode').onclick=()=>choose('mark');$('catmode').onclick=()=>choose('cat');$('hint').onclick=getHint;$('apply').onclick=applyHint;
$('undo').onclick=()=>{if(history.length){state=history.pop();finishHint();say();show()}};
$('reset').onclick=()=>{clearTimeout(clickTimer);clearTimeout(wrongTimer);choose('mark');state=Array(121).fill(0);lives=3;history=[];reveal=false;wrong=-1;finishHint();$('answer').textContent='查看答案';say();show()};
$('answer').onclick=()=>{reveal=!reveal;finishHint();$('answer').textContent=reveal?'收起答案':'查看答案';say();show()};
$('level1').onclick=()=>selectLevel(0);$('level2').onclick=()=>selectLevel(1);
const requested=/^#level-([12])$/.exec(location.hash);selectLevel(requested?Number(requested[1])-1:0);
window.addEventListener('hashchange',()=>{const match=/^#level-([12])$/.exec(location.hash);if(match&&Number(match[1])-1!==levelIndex)selectLevel(Number(match[1])-1)});
